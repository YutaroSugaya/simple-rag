version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: rag-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: rag-frontend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
